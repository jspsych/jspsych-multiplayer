<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Multiplayer Ultimatum Game (local, two-tab) — jsPsych multiplayer</title>
    <!-- jsPsych core MUST carry the multiplayer API (jsPsych#3694), which is not yet in a release.
         Until it merges, load the PR's preview build from jsDelivr instead of the published `jspsych`.
         This URL is pinned to the #3694 preview build SHA 49e6a93 — see examples/README.md
         "Running it" for how to find/re-pin the current preview link. -->
    <script src="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@5cb6b05bec8ca0e409145453220803b408cd7e50/packages/jspsych/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <!-- The three multiplayer packages. These resolve once the sibling packages are built in this
         repo; once they are published, load them from a CDN instead, e.g.
           <script src="https://unpkg.com/@jspsych-multiplayer/plugin-multiplayer-role"></script> -->
    <script src="../packages/adapter-multiplayer-local/dist/index.browser.min.js"></script>
    <script src="../packages/plugin-multiplayer-role/dist/index.browser.min.js"></script>
    <script src="../packages/plugin-multiplayer-sync/dist/index.browser.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@5cb6b05bec8ca0e409145453220803b408cd7e50/packages/jspsych/css/jspsych.css"
    />
  </head>

  <body></body>
  <script>
    // ===============================================================================================
    // Multiplayer Ultimatum Game (local, two-tab) — the same demo as ultimatum-game-jatos.html, wired to
    // adapter-multiplayer-local instead of adapter-multiplayer-jatos, so it runs from two browser
    // tabs on one machine with no server. The game itself (role assignment and the sync barriers) is
    // the same; what changes is the network backend and the lobby: JATOS forms and seals groups of
    // two itself, while here participants share a link, so a lobby trial waits for two players and
    // the role trial turns any later arrival into a spectator.
    //
    // Two players split a $10 pot. The PROPOSER offers the RESPONDER some amount; the RESPONDER
    // accepts (both keep the split) or rejects (both get nothing).
    //
    // Dev/demo only: the local adapter is same-origin, same-browser, same-machine — not for data
    // collection. Swap back to adapter-multiplayer-jatos (see ultimatum-game-jatos.html) for a real,
    // cross-device study; nothing else in the timeline below is backend-specific.
    // ===============================================================================================

    const jsPsych = initJsPsych();

    // Hold the adapter instance directly (no jatos.onLoad wrapper needed for the local backend). The
    // adapter keeps this tab's participant id in sessionStorage across a refresh, so a reloaded tab
    // comes back as the same participant. The group has moved on by then, so the page checks
    // jsPsych.multiplayer.restarted after connecting and tells a reloaded participant they can't
    // rejoin (see the end of this file).
    const localAdapter = new jsPsychAdapterMultiplayerLocal();

    const POT = 10;

    // A backstop for the mid-game barriers. A player who leaves is detected sooner through presence
    // (the barriers depend on the other player), so this only ends a wait for a player who stays
    // connected but never acts. Keep it well above how long a real player needs to decide.
    const PARTNER_TIMEOUT_MS = 60000;

    // The offer and the decision are exchanged across several trials, so those trials share one named
    // part of the shared data through `multiplayer_scope`. (Without it, each trial reads and writes its
    // own part, and the responder's trial would never see the proposer's offer.)
    const EXCHANGE_SCOPE = "offer_exchange";

    let myRole; // "proposer" | "responder" | "spectator" (undefined if role assignment failed)
    let proposerId;
    let responderId;
    let proposerOffer; // integer 0–10
    let responderDecision; // "accept" | "reject"
    let partnerLeft = false; // set if a barrier ends early: the other player left, it timed out, or the connection was lost

    // ── Lobby ────────────────────────────────────────────────────────────────────────────────
    // Mark ourselves as here and hold until at least two players are here. This is the membership
    // barrier: it caps the group the role trial then assigns over.
    const lobby = {
      type: jsPsychMultiplayerSync,
      // A lobby counts who is here, so someone leaving shouldn't end the wait
      participants: [],
      // Written to this trial's own part of the shared data, which is what wait_for sees
      write_data: { here: true },
      // Count connected players who reached the lobby; data stays after a player leaves
      wait_for: (group, presence) =>
        Object.keys(group).filter((id) => group[id].here && presence[id] === "connected").length >= 2,
      message: `<p>Waiting for another player to join…</p>
               <p>Open this page in another tab (keep the <code>?mp_session=</code> in the URL) to add a player.</p>`,
    };

    // ── Role assignment (deterministic consensus) ──────────────────────────────────────────────
    // The first two participants to reach this trial become proposer and responder; everyone beyond
    // the two declared slots gets the overflow role "spectator". Ordering is by `joinedAt`, a
    // timestamp the role plugin writes once (to the session scope of the shared data) when its trial
    // starts, with ties broken by participant id. The snapshot the plugin assigns over holds the
    // participants who have reached this trial and haven't left, each with their session data, so a
    // spectator who arrives mid-game sees both players' original timestamps and computes the SAME
    // pair.
    //
    // `ready` gates WHEN a snapshot is safe to assign over. A custom `ready` replaces the plugin's
    // own gate, so it checks both that two players are here and that each one's `joinedAt` has
    // arrived: a count-only predicate could assign the moment a peer appears, before its `joinedAt`
    // lands, and the two clients could disagree about who is the proposer.
    const assignRoles = {
      type: jsPsychMultiplayerRole,
      roles: ["proposer", "responder"],
      strategy: "join_order",
      overflow_role: "spectator",
      ready: (group) => {
        const ids = Object.keys(group);
        return ids.length >= 2 && ids.every((id) => group[id].joinedAt !== undefined);
      },
      message: "<p>Assigning roles…</p>",
      on_finish: () => {
        myRole = jsPsychMultiplayerRole.getMyRole();
        // If the trial ended before roles were assigned (for example, a player left), there are
        // no roles to read
        if (myRole == null) {
          return;
        }
        // participantsByRole() gives a list of IDs for each role; each role has one player here
        const byRole = jsPsychMultiplayerRole.participantsByRole();
        proposerId = byRole.proposer[0];
        responderId = byRole.responder[0];
      },
    };

    // ── Spectator: a third+ participant who arrived after the game was full ─────────────────────
    const gameFull = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: "<p>Sorry, this game is already full. Thank you for your interest.</p>",
          choices: "NO_KEYS",
          trial_duration: 4000,
          on_finish: () => jsPsych.multiplayer.disconnect(),
        },
      ],
      conditional_function: () => myRole === "spectator",
    };

    // ── Proposer: choose an offer ──────────────────────────────────────────────────────────────
    const proposerOfferTrial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <p>You are the <strong>Proposer</strong>.</p>
        <p>There is <strong>$${POT}</strong> in the pot.</p>
        <p>Choose how much to offer the Responder. You keep the rest.</p>
      `,
      choices: Array.from({ length: POT + 1 }, (_, index) => `$${index}`),
      on_finish: (data) => {
        proposerOffer = data.response; // button index equals dollar amount
      },
    };

    // ── Proposer: send the offer, then wait for the responder's decision ───────────────────────
    // If the responder leaves, the barrier ends with multiplayer_outcome "participant_left"; if they
    // stay but never decide, `timeout` ends it with "timeout". Either way on_finish sets one flag and
    // the timeline routes to a "left" screen instead of hanging.
    const proposerWaitTrial = {
      type: jsPsychMultiplayerSync,
      multiplayer_scope: EXCHANGE_SCOPE,
      write_data: () => ({ offer: proposerOffer }),
      wait_for: (group) => group[responderId]?.decision !== undefined,
      // Only the other player matters here; a spectator leaving must not end the round.
      participants: () => [responderId],
      timeout: PARTNER_TIMEOUT_MS,
      // Save the exchange's shared data in this trial's data, where on_finish reads the decision
      save_group: true,
      message: () => `
        <p>You offered the Responder <strong>$${proposerOffer}</strong> and kept $${POT - proposerOffer}.</p>
        <p>Waiting for the Responder…</p>
      `,
      on_finish: (data) => {
        // If the barrier ended without the condition met, there is no decision to read.
        if (data.multiplayer_outcome !== "completed") {
          partnerLeft = true;
          return;
        }
        responderDecision = data.group[responderId].decision;
      },
    };

    const proposerTimeline = {
      timeline: [proposerOfferTrial, proposerWaitTrial],
      conditional_function: () => myRole === "proposer",
    };

    // ── Responder: wait for the proposer's offer ───────────────────────────────────────────────
    const responderWaitTrial = {
      type: jsPsychMultiplayerSync,
      multiplayer_scope: EXCHANGE_SCOPE,
      wait_for: (group) => group[proposerId]?.offer !== undefined,
      participants: () => [proposerId],
      timeout: PARTNER_TIMEOUT_MS,
      save_group: true,
      message: "<p>Waiting for the Proposer's offer…</p>",
      on_finish: (data) => {
        if (data.multiplayer_outcome !== "completed") {
          partnerLeft = true;
          return;
        }
        proposerOffer = data.group[proposerId].offer;
      },
    };

    // ── Responder: accept or reject ────────────────────────────────────────────────────────────
    const responderDecisionTrial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: () => `
        <p>You are the <strong>Responder</strong>.</p>
        <p>The Proposer offered you <strong>$${proposerOffer}</strong> and kept $${POT - proposerOffer}.</p>
        <p>Do you accept?</p>
      `,
      choices: ["Accept", "Reject"],
      on_finish: (data) => {
        responderDecision = data.response === 0 ? "accept" : "reject";
      },
    };

    // ── Responder: send the decision ───────────────────────────────────────────────────────────
    const responderSendDecisionTrial = {
      type: jsPsychMultiplayerSync,
      multiplayer_scope: EXCHANGE_SCOPE,
      write_data: () => ({ decision: responderDecision }),
      // Resolve as soon as our own decision is visible in the shared data.
      wait_for: (group) => group[responderId]?.decision !== undefined,
      // Nothing to wait for from anyone else
      participants: [],
      message: "<p>Sending your decision…</p>",
    };

    const responderTimeline = {
      timeline: [
        responderWaitTrial,
        {
          // Only decide if the proposer actually made an offer — skipped if they abandoned.
          timeline: [responderDecisionTrial, responderSendDecisionTrial],
          conditional_function: () => !partnerLeft,
        },
      ],
      conditional_function: () => myRole === "responder",
    };

    // ── Both players: outcome ──────────────────────────────────────────────────────────────────
    const outcomeTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => {
        const accepted = responderDecision === "accept";
        const proposerEarns = accepted ? POT - proposerOffer : 0;
        const responderEarns = accepted ? proposerOffer : 0;

        const verdict = accepted
          ? `<p style="color:green">The offer was <strong>accepted</strong>.</p>`
          : `<p style="color:red">The offer was <strong>rejected</strong>. Both players earn $0.</p>`;

        return myRole === "proposer"
          ? `${verdict}
             <p>You offered $${proposerOffer} and kept $${POT - proposerOffer}.</p>
             <p>You earn: <strong>$${proposerEarns}</strong></p>`
          : `${verdict}
             <p>The Proposer offered you $${proposerOffer}.</p>
             <p>You earn: <strong>$${responderEarns}</strong></p>`;
      },
      choices: [" "],
      prompt: "<p>Press space to finish.</p>",
    };

    // Shown instead of the outcome when the other player left mid-game (or a barrier timed out).
    const partnerLeftScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus:
            "<p>The other player left the game, so this round could not be completed.</p>" +
            "<p>Thank you for playing.</p>",
          choices: [" "],
          prompt: "<p>Press space to finish.</p>",
        },
      ],
      conditional_function: () => partnerLeft,
    };

    // The outcome runs only if both players saw the round through.
    const outcome = {
      timeline: [outcomeTrial],
      conditional_function: () => !partnerLeft,
    };

    // ── Fallback: role assignment failed ───────────────────────────────────────────────────────
    // If the role trial ends without assigning roles (e.g. a player left before it could), this
    // client is neither an active player nor a spectator, so give it an explicit exit screen instead
    // of letting it fall off the end of the timeline onto a blank page.
    const noGroupScreen = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: "<p>Could not form a group — the session has ended.</p>",
          choices: "NO_KEYS",
          trial_duration: 4000,
          on_finish: () => jsPsych.multiplayer.disconnect(),
        },
      ],
      conditional_function: () => myRole == null,
    };

    // The game runs only for the two active players (proposer/responder); spectators saw the
    // "game full" screen and a client without a role saw the "could not form a group" screen above.
    const gameTimeline = {
      timeline: [proposerTimeline, responderTimeline, partnerLeftScreen, outcome],
      conditional_function: () => myRole === "proposer" || myRole === "responder",
    };

    // ── Final screen: tell the participant it's over and let them close the tab ────────────────
    // Runs after every path (played the round, spectated, or no group formed) so no one is left
    // staring at a blank page. The download button is opt-in and doesn't end the trial — this is
    // the local/dev adapter with no backend collecting data, so a click-triggered download is the
    // only way to inspect a session's data, and making it opt-in (rather than an automatic
    // download) keeps repeated test runs from littering the Downloads folder.
    const doneScreen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <p>The session has ended. You may close this tab.</p>
        <p><button id="download-data-btn">Download data (JSON)</button></p>
      `,
      choices: "NO_KEYS",
      on_load: () => {
        document.getElementById("download-data-btn").addEventListener("click", () => {
          jsPsych.data.get().localSave("json", "ultimatum-game-data.json");
        });
      },
    };

    const reloadedScreen = {
      type: jsPsychHtmlButtonResponse,
      stimulus:
        "<p>You reloaded the page, so you can't rejoin this game.</p>" +
        "<p>Thank you for taking part.</p>",
      choices: ["Finish"],
    };

    // Connect the backend, then run. Everything above is backend-agnostic — swapping the adapter
    // is the only change from ultimatum-game-jatos.html (plus the jatos.onLoad wrapper it no longer
    // needs, and the lobby, which JATOS replaces by forming the group itself).
    jsPsych.multiplayer
      .connect(localAdapter)
      .then(() => {
        // A reload keeps this tab's participant ID, but the group has moved on without it and
        // counts it as left, so it can't rejoin: say so instead of starting the game over.
        if (jsPsych.multiplayer.restarted) {
          jsPsych.run([reloadedScreen]);
          return;
        }
        jsPsych.run([lobby, assignRoles, gameFull, noGroupScreen, gameTimeline, doneScreen]);
      })
      .catch((error) => {
        // Show a failed connect instead of leaving a blank page
        console.error(error);
        document.body.innerHTML = "<p>Couldn't connect to the game. Please reload the page to try again.</p>";
      });
  </script>
</html>
