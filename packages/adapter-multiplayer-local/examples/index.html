<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jsPsychAdapterMultiplayerLocal Example</title>
    <!-- jsPsych core must include the multiplayer API (jsPsych#3694), which is not in a release yet.
         This loads the PR's preview build, pinned to #3694 commit ad80b345 (preview SHA a6e05be).
         If the demo misbehaves against a newer #3694, re-pin — see examples/README.md. -->
    <script src="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@a6e05be017bcadf6ca208ed2fc0ac79e438c9626/packages/jspsych/dist/index.browser.min.js"></script>
    <!-- The adapter's own IIFE build. Run `npm run build` in this package first — the bundle below
         does not exist until you do. Once this package is published you could instead load it from
         a CDN:
           <script src="https://unpkg.com/@jspsych-multiplayer/adapter-multiplayer-local"></script> -->
    <script src="../dist/index.browser.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      pre { background: #f4f4f5; border-radius: 6px; padding: 0.75rem 1rem; white-space: pre-wrap; }
      input { padding: 0.4rem; width: 60%; }
      button { padding: 0.4rem 0.8rem; }
      code { background: #eee; padding: 0 0.25rem; border-radius: 3px; }
    </style>
  </head>

  <body>
    <!-- ===========================================================================================
         RUNNABLE two-tab demo of adapter-multiplayer-local, using jsPsych.multiplayer directly
         (no timeline). It is a development / demo tool only: localStorage + cross-tab signalling
         are same-origin, same-browser, same-machine, and NOT for data collection.

         TO RUN IT:
           1. Build this package:  npm run build   (produces ../dist/index.browser.min.js)
           2. Serve the repo over http(s) — localStorage/BroadcastChannel don't work from file://:
                npx http-server .
           3. Open the printed URL to THIS file in one tab. The adapter mints a session id and writes
              it into the URL as ?mp_session=… .
           4. Copy that FULL URL (including ?mp_session=…) into a SECOND fresh tab or window to join
              the same room. (Don't use "Duplicate Tab" — it copies sessionStorage and the tabs would
              share a participant id.) Type in either tab and watch the group update in both. Close
              a tab to see it become "away" in the other, then "left" after 10 seconds.
         =========================================================================================== -->
    <h1>Local multiplayer adapter — two-tab demo</h1>
    <p>
      Your participant id: <code id="me"></code>. Open the current URL (with its
      <code>?mp_session=</code>) in a second tab to see the two of you sharing state.
    </p>
    <p>
      <input id="msg" placeholder="Type a message…" autocomplete="off" />
      <button id="send">Send</button>
    </p>
    <h2>Shared data</h2>
    <pre id="group">(connecting…)</pre>
    <h2>Presence</h2>
    <pre id="presence"></pre>

    <script>
      (async () => {
        const jsPsych = initJsPsych();
        // The IIFE build exposes the adapter class as the global `jsPsychAdapterMultiplayerLocal`.
        await jsPsych.multiplayer.connect(new jsPsychAdapterMultiplayerLocal());
        document.getElementById("me").textContent = jsPsych.multiplayer.participantId;

        const groupEl = document.getElementById("group");
        const presenceEl = document.getElementById("presence");
        // Called now, and again whenever any tab writes or anyone's presence changes
        jsPsych.multiplayer.subscribe((group, presence) => {
          groupEl.textContent = JSON.stringify(group, null, 2);
          presenceEl.textContent = JSON.stringify(presence, null, 2);
        });

        const input = document.getElementById("msg");
        const send = () => {
          const text = input.value.trim();
          if (!text) return;
          jsPsych.multiplayer.update({ message: text, at: Date.now() }).catch((err) => {
            // e.g. QuotaExceededError
            groupEl.textContent = "write failed: " + err.message;
          });
          input.value = "";
        };
        document.getElementById("send").addEventListener("click", send);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") send();
        });
        // No unload handler needed: the adapter removes this tab's presence on pagehide.
      })();
    </script>
  </body>
</html>
