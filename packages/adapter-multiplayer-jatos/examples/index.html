<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jsPsychAdapterMultiplayerJatos Example</title>
    <!-- The multiplayer API (jsPsych#3694) isn't in a jsPsych release yet, so load a preview build
         of the PR, pinned to one build. Switch back to https://unpkg.com/jspsych once it's released. -->
    <script src="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@5cb6b05bec8ca0e409145453220803b408cd7e50/packages/jspsych/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <!-- JATOS serves jatos.js from the study root, but the study page has to load it itself; it is
         not injected automatically. Without this tag the `jatos` global is undefined and the adapter
         can't connect. The path only resolves inside a JATOS study. -->
    <script src="jatos.js"></script>
    <!-- Once this adapter package is published, load it from a CDN instead:
         <script src="https://unpkg.com/@jspsych-multiplayer/adapter-multiplayer-jatos"></script> -->
    <script src="../dist/index.browser.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@5cb6b05bec8ca0e409145453220803b408cd7e50/packages/jspsych/css/jspsych.css"
    />
  </head>

  <body></body>
  <script>
    // ---------------------------------------------------------------------------------------------
    // ILLUSTRATIVE example — it shows the intended API, it is NOT a self-contained demo.
    //
    // This adapter is the network backend that the multiplayer plugins talk through. To run it, the
    // page must run INSIDE JATOS as a group study, so that the `jatos` global from jatos.js exists;
    // it can't run from a plain browser tab. For a complete runnable study, see the JATOS
    // ultimatum-game example in this repository's examples/ folder.
    // ---------------------------------------------------------------------------------------------

    const jsPsych = initJsPsych({
      // Hand the collected data back to JATOS when the experiment ends.
      on_finish: () => jatos.endStudy(jsPsych.data.get().json()),
    });

    const timeline = [
      {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<p>Connected to the JATOS group session. Press any key.</p>",
      },
      // ...your multiplayer plugins (e.g. multiplayer-sync, multiplayer-role) go here. They run
      // unchanged once an adapter is connected.
    ];

    // Connect the adapter (backed by the JATOS group session) before running the timeline. The IIFE
    // build exposes the adapter class as the global `jsPsychAdapterMultiplayerJatos`. Its one
    // option is sealWhenFull (default true). Timeouts are options of connect() itself, e.g.
    // connect(adapter, { connectTimeout: 20000, reconnectTimeout: 5 * 60_000 }) — see the README.
    jatos.onLoad(async () => {
      await jsPsych.multiplayer.connect(new jsPsychAdapterMultiplayerJatos());
      await jsPsych.run(timeline);
    });
  </script>
</html>
