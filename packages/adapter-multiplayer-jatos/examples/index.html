<!doctype html>
<html>
  <head>
    <title>jsPsychAdapterMultiplayerJatos Example</title>
    <script src="https://unpkg.com/jspsych"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <!-- jatos.js is injected by JATOS at runtime; it is not available outside a JATOS study. -->
    <!-- Once this adapter package is published, load it from a CDN instead:
         <script src="https://unpkg.com/@jspsych-multiplayer/adapter-multiplayer-jatos"></script> -->
    <script src="../dist/index.browser.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
  </head>

  <body></body>
  <script>
    // ---------------------------------------------------------------------------------------------
    // ILLUSTRATIVE example — it shows the intended API, it is NOT a self-contained demo.
    //
    // This adapter is the network backend that the multiplayer plugins talk through. To run it you
    // need:
    //   1. to be running INSIDE JATOS as a group study (so the `jatos` global from jatos.js exists),
    //      and
    //   2. the jsPsych multiplayer API (jsPsych#3694), which is not yet in a released jsPsych.
    // It therefore cannot run from a single browser tab today. The full runnable, end-to-end demo
    // is the turn-based ultimatum-game example (forthcoming).
    // ---------------------------------------------------------------------------------------------

    const jsPsych = initJsPsych({
      // Hand the collected data back to JATOS when the experiment ends.
      on_finish: () => jatos.endStudy(jsPsych.data.get().json()),
    });

    const timeline = [
      {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: () =>
          `<p>Connected to fixed two-person JATOS group <code>${adapter.groupId}</code>. ` +
          "Press any key.</p>",
      },
      // ...your multiplayer plugins (e.g. multiplayer-sync, multiplayer-role) go here. They run
      // unchanged once an adapter is connected.
    ];

    // Connect the adapter (backed by the JATOS group session) before running the timeline. The IIFE
    // build exposes the adapter class as the global `jsPsychAdapterMultiplayerJatos`.
    const adapter = new jsPsychAdapterMultiplayerJatos();

    // Transport-level example only. Production studies should put the timeout and no-match UI in
    // a lobby plugin/timeline and route that outcome to their own compensation/completion policy.
    function waitForLiveDyad(timeoutMs) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let unsubscribe = () => {};
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          unsubscribe();
          reject(new Error("No live partner arrived before the lobby timeout."));
        }, timeoutMs);
        unsubscribe = adapter.subscribePresence(({ snapshot }) => {
          if (!settled && snapshot.openChannelMemberIds.length === 2) {
            settled = true;
            clearTimeout(timer);
            unsubscribe();
            resolve(snapshot);
          }
        });
        // subscribePresence replays synchronously, before it returns the real unsubscribe handle.
        if (settled) unsubscribe();
      });
    }

    jatos.onLoad(async () => {
      await jsPsych.multiplayer.connect(adapter);
      try {
        await waitForLiveDyad(5 * 60 * 1000);
        // The batch should also set maxActiveMembers=2. Fixing at the game boundary prevents JATOS
        // from silently assigning a replacement if either member later leaves.
        await adapter.sealGroup();
        await jsPsych.run(timeline);
      } catch (error) {
        await jsPsych.multiplayer.disconnect();
        // A production study should route this structured outcome to its own no-match/error screen
        // and compensation policy. The example still demonstrates a bounded terminal path.
        document.body.innerHTML =
          "<p>No partner became available. This session has ended cleanly.</p>";
        console.error(error);
      }
    });
  </script>
</html>
