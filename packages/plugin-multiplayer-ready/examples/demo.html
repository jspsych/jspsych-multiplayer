<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jsPsychMultiplayerReady — runnable demo</title>
    <script src="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@4df7fbb672806086c7e118e53aba2262f27edf68/packages/jspsych/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <script src="../dist/index.browser.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jspsych/jsPsych@4df7fbb672806086c7e118e53aba2262f27edf68/packages/jspsych/css/jspsych.css"
    />
  </head>

  <body></body>
  <script>
    // =============================================================================================
    // RUNNABLE demo of plugin-multiplayer-ready.
    //
    // Needs a jsPsych build with the multiplayer API (jsPsych#3694). It connects jsPsych.multiplayer
    // to a tiny localStorage adapter defined below, so the plugin runs against the real session.
    //
    //   • DEFAULT (single tab): a simulated peer checks in ~2.5s after load, so you can see the whole
    //     flow — click "I'm ready", watch the waiting message, then advance — on your own.
    //   • REAL cross-tab: add `?sim=0` to the URL and open the SAME url (it pins `?mp_session=`) in a
    //     second tab. Each tab clicks ready; the gate clears only once BOTH have.
    // =============================================================================================

    const params = new URLSearchParams(location.search);
    const simulatePeer = params.get("sim") !== "0"; // simulated peer on by default

    // Pin a shared session id into the URL so a second tab joins the same group.
    let sessionId = params.get("mp_session");
    if (!sessionId) {
      sessionId = Math.random().toString(36).slice(2, 8);
      params.set("mp_session", sessionId);
      history.replaceState(null, "", `${location.pathname}?${params}`);
    }
    const myId = "p-" + Math.random().toString(36).slice(2, 7);
    const prefix = `mpready-demo:${sessionId}:`;

    // --- Minimal localStorage adapter -------------------------------------------------------------
    // Implements the adapter contract: connect() returns a connection with participantId, sessionId,
    // getAll, connectedParticipants, push, and disconnect, and calls onChange() when data changes. To keep
    // the demo short, everyone with a slot counts as connected, so nobody is ever marked as left.
    const demoAdapter = {
      async connect({ onChange }) {
        const getAll = () => {
          const out = {};
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith(prefix))
              out[key.slice(prefix.length)] = JSON.parse(localStorage.getItem(key));
          }
          return out;
        };
        // Another tab's write fires a storage event
        window.addEventListener("storage", onChange);
        return {
          participantId: myId,
          sessionId,
          getAll,
          connectedParticipants: () => [myId, ...Object.keys(getAll())],
          async push(data) {
            localStorage.setItem(prefix + myId, JSON.stringify(data));
            onChange();
          },
          async disconnect() {
            window.removeEventListener("storage", onChange);
          },
        };
      },
    };

    const jsPsych = initJsPsych({
      on_finish: () => jsPsych.data.displayData(), // dump the trial data so you can inspect rt/wait_time/etc.
    });

    // Simulated peer: check in at the ready gate a couple of seconds after load. It writes its data
    // in the multiplayer API's storage format: bookkeeping under `$mp`, and the flag in the trial's
    // part of the shared data, which the gate below names "lobby" with `multiplayer_scope`.
    if (simulatePeer) {
      setTimeout(() => {
        localStorage.setItem(
          prefix + "sim-peer",
          JSON.stringify({
            $mp: { v: 1, instance: "sim-peer", epoch: 1 },
            scopes: { lobby: { ready: true, name: "Sim Player" } },
          }),
        );
        window.dispatchEvent(new StorageEvent("storage")); // nudge our own tab
      }, 2500);
    }

    const readyGate = {
      type: jsPsychMultiplayerReady,
      multiplayer_scope: "lobby", // names the trial's shared data, so the simulated peer can write to it
      expected_players: 2, // this participant + one other
      stimulus: "<p>You'll be matched with another player.</p>",
      prompt:
        "<p style='color:#666'>(demo: a simulated player checks in a couple of seconds after the page loads)</p>",
      waiting_message: "<p>✅ You're ready. Waiting for the other player to check in…</p>",
      minimum_wait: 1500, // keep the waiting message up ≥1.5s so it never just flashes by
      timeout: 30000,
      on_timeout: () => console.warn("The other player didn't check in within 30s."),
    };

    const start = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<p>🎉 Everyone's ready! Press any key to begin the experiment.</p>",
    };

    jsPsych.multiplayer
      .connect(demoAdapter)
      .then(() => jsPsych.run([readyGate, start]))
      .catch((error) => {
        // Show a failed connect instead of leaving a blank page
        console.error(error);
        document.body.textContent = "Couldn't connect: " + error.message;
      });
  </script>
</html>
